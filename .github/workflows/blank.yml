name: Deploy Application

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: echo "Building app"

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - run: echo "Deploying to DEV"

  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - run: echo "Deploying to QA"

  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: production

    steps:
      - run: echo "Deploying to PROD"
